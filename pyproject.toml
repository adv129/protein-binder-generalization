[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "protein-binder-generalization"
version = "0.1.0"
description = "Cross-target evaluation of computational protein-binder confidence metrics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=0.26",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=18.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4.3",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/protein_binder_generalization"]

[tool.ruff]
line-length = 88
target-version = "py311"
